[project]
name = "run-script"
version = "0.1.0"
description = "Cooperative Python scripts with explicit pauses and JSON progress"
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/outside-labs/run_script"
Issues = "https://github.com/outside-labs/run_script/issues"

[project.scripts]
run-script = "run_script:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
