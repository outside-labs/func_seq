[project]
name = "func-seq"
version = "0.1.0"
description = "Cooperative function sequences with explicit pauses and JSON progress"
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/outside-labs/func_seq"
Issues = "https://github.com/outside-labs/func_seq/issues"

[project.scripts]
func-seq = "func_seq.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/*.md", "examples/*.py", "tests/*.py", "scripts/*.py"]
